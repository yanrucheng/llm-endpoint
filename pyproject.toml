[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-endpoint"
version = "0.1.0"
description = "Professional, reusable LLM endpoint execution boundary for Python applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "llm-endpoint maintainers" },
]
keywords = ["llm", "endpoint", "routing", "structured-output", "telemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_endpoint"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
